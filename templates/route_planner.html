<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游路线规划器 | 全球旅游数据</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
            --border-color: rgba(0, 0, 0, 0.06);
            --shadow-color: rgba(0, 0, 0, 0.03);
            --navbar-bg: rgba(255, 255, 255, 0.85);
            --sidebar-bg: rgba(245, 245, 247, 0.6);
        }

        body.dark-theme {
            --bg-primary: #000000;
            --bg-secondary: #1d1d1f;
            --bg-tertiary: #161617;
            --bg-card: #1d1d1f;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --accent-color: #2997ff;
            --accent-hover: #4da3ff;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --navbar-bg: rgba(29, 29, 31, 0.85);
            --sidebar-bg: rgba(29, 29, 31, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: background 0.4s, color 0.4s;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 24px;
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .navbar-nav {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            text-decoration: none;
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.05);
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        /* 主布局：左右两栏 */
        .main-layout {
            display: flex;
            height: calc(100vh - 64px);
            margin-top: 64px;
            overflow: hidden;
        }

        /* 左侧地球仪区域 */
        .globe-panel {
            flex: 2;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        #globe {
            width: 100%;
            height: 100%;
        }

        /* 右侧控制与路线面板 */
        .sidebar-panel {
            flex: 1;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 控制区块 */
        .control-group {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-color);
        }

        .control-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 140px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
        }

        .btn-generate {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn-generate:hover {
            background: var(--accent-hover);
        }

        /* 路线选项卡 */
        .route-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .route-tab {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .route-tab.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 路线详情区域 */
        .route-detail {
            margin-top: 8px;
        }

        .route-city-list {
            list-style: none;
            margin: 12px 0;
        }

        .route-city-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .city-name {
            font-weight: 500;
        }

        .city-tag {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }

        .distance-info {
            text-align: right;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* 滚动条美化 */
        .sidebar-panel::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-panel::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .sidebar-panel::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 3px;
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
                height: auto;
            }
            .globe-panel {
                height: 500px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .sidebar-panel {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">全球旅游</div>
        <div class="navbar-nav">
            <a href="/" class="nav-link">首页</a>
            <a href="/explore" class="nav-link">探索城市</a>
            <a href="/compare" class="nav-link">对比分析</a>
            <a href="/planner" class="nav-link">旅行规划器</a>
            <a href="/route_planner" class="nav-link active">路线规划</a>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </nav>

    <div class="main-layout">
        <div class="globe-panel">
            <div id="globe"></div>
        </div>

        <div class="sidebar-panel">
            <div class="control-group">
                <div class="control-title">行程设置</div>
                <div class="row">
                    <div class="col">
                        <label>起点城市</label>
                        <select id="startCity">
                            <option value="">选择起点</option>
                            {% for city in cities %}
                            <option value="{{ city.id }}">{{ city.city }}, {{ city.country }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col">
                        <label>终点城市</label>
                        <select id="endCity">
                            <option value="">选择终点</option>
                            {% for city in cities %}
                            <option value="{{ city.id }}">{{ city.city }}, {{ city.country }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>途经城市总数（含起终点）: <span id="cityCountValue">3</span></label>
                        <input type="range" id="totalCities" min="2" max="8" value="3" step="1">
                    </div>
                    <div class="col">
                        <button class="btn-generate" id="planBtn">生成路线</button>
                    </div>
                </div>
            </div>

            <div id="routesPanel" class="control-group">
                <div class="control-title">推荐路线</div>
                <div class="loading">请选择起点和终点，然后点击“生成路线”</div>
            </div>
        </div>
    </div>

    <script>
        // 从后端注入的城市数据
        const allCities = {{ cities | tojson | safe }};
        const cityMap = new Map();
        allCities.forEach(c => { cityMap.set(c.id, c); });

        let globeFigure = null;
        let currentRoutes = [];
        let activeRouteIndex = 0;

        // 初始化地球仪（只显示城市点）
        function initGlobe() {
            const cityPoints = allCities.map(c => ({
                lon: c.longitude,
                lat: c.latitude,
                name: c.city,
                country: c.country,
                id: c.id
            }));

            const hoverTexts = cityPoints.map(p => `<b>${p.name}</b><br>${p.country}`);

            const trace = {
                type: 'scattergeo',
                lon: cityPoints.map(p => p.lon),
                lat: cityPoints.map(p => p.lat),
                mode: 'markers',
                marker: { size: 5, color: '#0071e3', line: { width: 1, color: 'white' }, opacity: 0.9 },
                text: hoverTexts,
                hoverinfo: 'text',
                name: '城市'
            };

            const layout = {
                geo: {
                    projection: { type: 'orthographic' },
                    showland: true,
                    landcolor: '#f5f5f7',
                    coastlinecolor: '#d1d1d6',
                    showocean: true,
                    oceancolor: '#e8f4fc',
                    showcountries: true,
                    countrycolor: '#d1d1d6',
                    showframe: false,
                    bgcolor: 'rgba(0,0,0,0)'
                },
                margin: { l: 0, r: 0, t: 0, b: 0 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            };

            Plotly.newPlot('globe', [trace], layout, { responsive: true, displayModeBar: true });
            globeFigure = document.getElementById('globe');
        }

        // 更新地球仪配色（主题切换时）
        function updateGlobeTheme() {
            const isDark = document.body.classList.contains('dark-theme');
            const landcolor = isDark ? '#424245' : '#f5f5f7';
            const oceancolor = isDark ? '#1d1d1f' : '#e8f4fc';
            const countrycolor = isDark ? '#424245' : '#d1d1d6';
            Plotly.relayout('globe', {
                'geo.landcolor': landcolor,
                'geo.oceancolor': oceancolor,
                'geo.countrycolor': countrycolor,
                'geo.coastlinecolor': countrycolor
            });
        }

        // 在地球仪上绘制路线
        function drawRoute(routeCities) {
            if (!globeFigure) return;
            const lons = routeCities.map(c => c.longitude);
            const lats = routeCities.map(c => c.latitude);

            const lineTrace = {
                type: 'scattergeo',
                lon: lons,
                lat: lats,
                mode: 'lines+markers',
                line: { width: 3, color: '#ff3b30' },
                marker: { size: 8, color: '#ff3b30', symbol: 'circle' },
                text: routeCities.map(c => `${c.city}`),
                hoverinfo: 'text',
                name: '路线'
            };

            const startEndTrace = {
                type: 'scattergeo',
                lon: [lons[0], lons[lons.length-1]],
                lat: [lats[0], lats[lats.length-1]],
                mode: 'markers',
                marker: { size: 12, color: ['#34c759', '#ff9500'], symbol: 'star', line: { width: 2, color: 'white' } },
                text: [`起点: ${routeCities[0].city}`, `终点: ${routeCities[routeCities.length-1].city}`],
                hoverinfo: 'text',
                name: '起终点'
            };

            const currentData = globeFigure.data;
            const newData = currentData.filter(trace => trace.name !== '路线' && trace.name !== '起终点');
            newData.push(lineTrace);
            newData.push(startEndTrace);

            Plotly.react('globe', newData, globeFigure.layout, { responsive: true });
        }

        // 渲染右侧路线面板（简洁列表风格）
        function renderRoutesPanel(routes) {
            const panel = document.getElementById('routesPanel');
            if (!routes || routes.length === 0) {
                panel.innerHTML = `<div class="control-title">推荐路线</div>
                                   <div class="empty-state">没有生成任何路线，请尝试不同的起终点或城市数量</div>`;
                return;
            }
            currentRoutes = routes;

            let tabsHtml = `<div class="control-title">推荐路线</div>
                            <div class="route-tabs">`;
            routes.forEach((route, idx) => {
                tabsHtml += `<div class="route-tab ${idx === activeRouteIndex ? 'active' : ''}" data-idx="${idx}">路线 ${idx+1} (${route.total_distance_km} km)</div>`;
            });
            tabsHtml += `</div>`;

            const activeRoute = routes[activeRouteIndex];
            let detailHtml = `<div class="route-detail">
                                <ul class="route-city-list">`;
            activeRoute.cities.forEach((city, idx) => {
                detailHtml += `<li>
                                <span class="city-name">${idx+1}. ${city.city}</span>
                                <span class="city-tag">${city.country} · ${city.top_trait || '特色'}</span>
                              </li>`;
            });
            detailHtml += `</ul>
                            <div class="distance-info">总距离: ${activeRoute.total_distance_km} 公里</div>
                          </div>`;

            panel.innerHTML = tabsHtml + detailHtml;

            // 绑定选项卡事件
            document.querySelectorAll('.route-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const idx = parseInt(tab.dataset.idx);
                    if (!isNaN(idx) && idx !== activeRouteIndex) {
                        activeRouteIndex = idx;
                        renderRoutesPanel(routes);
                        drawRoute(routes[activeRouteIndex].cities);
                    }
                });
            });
        }

        // 调用后端生成路线
        async function planRoute() {
            const startId = document.getElementById('startCity').value;
            const endId = document.getElementById('endCity').value;
            const totalCities = parseInt(document.getElementById('totalCities').value);

            if (!startId || !endId) {
                alert('请选择起点和终点城市');
                return;
            }
            if (startId === endId) {
                alert('起点和终点不能相同');
                return;
            }

            // 显示加载状态
            document.getElementById('routesPanel').innerHTML = `<div class="control-title">推荐路线</div>
                                                                <div class="loading">正在规划路线...</div>`;

            try {
                const response = await fetch('/api/plan_route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start_id: startId, end_id: endId, total_cities: totalCities })
                });
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                    document.getElementById('routesPanel').innerHTML = `<div class="control-title">推荐路线</div>
                                                                        <div class="empty-state">生成失败，请尝试其他参数</div>`;
                    return;
                }
                activeRouteIndex = 0;
                renderRoutesPanel(data.routes);
                if (data.routes.length > 0) {
                    drawRoute(data.routes[0].cities);
                }
            } catch (err) {
                console.error(err);
                alert('请求失败，请检查网络或后端');
            }
        }

        // 主题切换
        function initThemeToggle() {
            const toggle = document.getElementById('themeToggle');
            const saved = localStorage.getItem('travelDashboardTheme');
            if (saved === 'dark') {
                document.body.classList.add('dark-theme');
                toggle.querySelector('.theme-icon').textContent = '☀️';
            } else {
                toggle.querySelector('.theme-icon').textContent = '🌙';
            }
            toggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-theme');
                const isDark = document.body.classList.contains('dark-theme');
                localStorage.setItem('travelDashboardTheme', isDark ? 'dark' : 'light');
                toggle.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
                updateGlobeTheme();
            });
        }

        // 滑块显示值
        document.getElementById('totalCities').addEventListener('input', (e) => {
            document.getElementById('cityCountValue').innerText = e.target.value;
        });

        document.getElementById('planBtn').addEventListener('click', planRoute);

        // 初始化
        initGlobe();
        initThemeToggle();
    </script>
</body>
</html>
