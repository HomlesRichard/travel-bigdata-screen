<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>城市直达 · 键盘上下切换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('/preview.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.15);
            z-index: 0;
            pointer-events: none;
        }

        /* 左侧可聚焦卡片 */
        .city-list-card {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: auto;
            min-width: 250px;
            max-width: 300px;
            background: rgba(10, 20, 30, 0.5);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            border-radius: 0 2rem 2rem 0;
            border-left: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.25);
            z-index: 2;
            overflow-y: auto;
            padding: 1rem 0.8rem 1rem 0.8rem;
            outline: none; /* 去掉默认焦点环，但保留键盘可聚焦 */
        }
        /* 自定义焦点样式，方便用户知道当前键盘控制区域 */
        .city-list-card:focus {
            box-shadow: 0 0 0 2px rgba(255, 220, 100, 0.6), 2px 0 20px rgba(0,0,0,0.25);
        }

        .city-list-card::-webkit-scrollbar {
            width: 4px;
        }
        .city-list-card::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .city-list-card::-webkit-scrollbar-thumb {
            background: rgba(255,255,240,0.5);
            border-radius: 10px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        .card-header .sub {
            font-size: 0.7rem;
            color: #e0e0e0;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            margin-top: 0.3rem;
        }

        .city-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }
        .city-btn {
            background: rgba(20, 35, 50, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 2rem;
            padding: 0.6rem 0.8rem;
            color: #f5f5f5;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .city-btn:hover {
            background: rgba(80, 120, 160, 0.7);
            border-color: rgba(255,215,0,0.6);
            transform: translateX(3px);
        }
        .city-btn.active {
            background: #2c5f8aee;
            border-color: #ffd966;
            box-shadow: 0 0 6px rgba(255,220,0,0.3);
        }
        .city-emoji {
            font-size: 1.1rem;
        }
        .city-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading-indicator {
            text-align: center;
            color: #ddd;
            padding: 1rem;
            font-size: 0.8rem;
        }

        /* 右侧卡片面积扩大 */
        .info-card-expanded {
            position: fixed;
            bottom: 0;
            right: 0;
            background: rgba(10, 20, 30, 0.5);
            backdrop-filter: blur(14px);
            width: min(960px, 94vw);
            max-width: 1000px;
            min-height: 190px;
            padding: 1.2rem 2rem;
            border-top-left-radius: 2rem;
            border-bottom-left-radius: 0;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-right: none;
            border-bottom: none;
            box-shadow: -4px -4px 28px rgba(0, 0, 0, 0.3);
            z-index: 2;
            text-align: left;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: all 0.2s;
            overflow-y: auto;
        }
        .info-card-expanded::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .info-card-expanded::-webkit-scrollbar-track {
            background: rgba(255,255,240,0.1);
            border-radius: 8px;
        }
        .info-card-expanded::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.5);
            border-radius: 8px;
        }

        .city-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
        }
        .detail-main {
            flex: 3;
            min-width: 200px;
        }
        .detail-badge {
            flex-shrink: 0;
            text-align: right;
        }
        .detail-main p {
            margin: 0.35rem 0;
            line-height: 1.45;
            font-size: 0.85rem;
        }
        .detail-main strong {
            color: #ffecb3;
        }
        .city-name-large {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: #fff7e0;
        }
        .tag {
            display: inline-block;
            background: rgba(0,0,0,0.5);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-right: 0.5rem;
            margin-top: 0.3rem;
        }
        .badge-status {
            background: #15803dcc;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            white-space: nowrap;
        }
        hr {
            margin: 0.8rem 0 0.4rem;
            border-color: rgba(255,255,255,0.2);
        }
        .footer-tip {
            font-size: 0.65rem;
            opacity: 0.8;
            text-align: center;
            margin-top: 0.6rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        @media (max-width: 750px) {
            .city-list-card {
                min-width: 200px;
                max-width: 260px;
                padding: 0.8rem 0.6rem;
            }
            .city-btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
            .info-card-expanded {
                width: 96vw;
                padding: 1rem 1.2rem;
                min-height: 170px;
            }
            .detail-badge {
                text-align: left;
                margin-top: 0.3rem;
            }
            .city-detail {
                flex-direction: column;
            }
        }
        @media (max-width: 480px) {
            .city-list-card {
                max-width: 70vw;
            }
            .city-name-large {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<!-- 左侧城市列表卡片（可聚焦，支持键盘上下键） -->
<div class="city-list-card" id="cityListCard" tabindex="0">
    <div class="card-header">
        <h1>🗺️ 目的地</h1>
        <div class="sub">点击 / 上下键切换</div>
    </div>
    <div id="cityListContainer" class="city-items">
        <div class="loading-indicator">⏳ 加载城市列表中...</div>
    </div>
</div>

<!-- 右侧扩展信息卡片 -->
<div class="info-card-expanded">
    <div id="cityDetailContainer">
        <div style="text-align: center; padding: 0.8rem;">
            <span class="badge-status" style="background:#3b82f6cc;">✨ 请从左侧选择城市</span>
        </div>
    </div>
    <hr>
    <div class="footer-tip">
        <span>📊 数据来自旅行数据集</span>
        <span>🖼️ 全屏背景·毛玻璃设计</span>
        <span id="bgStatusSpan">🖼️ 背景图片检测中...</span>
    </div>
</div>

<script>
    // DOM 元素
    const cityListCard = document.getElementById('cityListCard');
    const cityListContainer = document.getElementById('cityListContainer');
    const detailContainer = document.getElementById('cityDetailContainer');
    const bgStatusSpan = document.getElementById('bgStatusSpan');

    let currentActiveCity = null;
    let cityButtons = [];     // 存储城市按钮DOM元素列表
    let currentIndex = -1;    // 当前选中按钮的索引

    // 加载城市列表并渲染为按钮列表
    async function loadCityList() {
        try {
            const response = await fetch('/api/cities');
            if (!response.ok) throw new Error('获取城市列表失败');
            const cities = await response.json();
            if (!cities || cities.length === 0) {
                cityListContainer.innerHTML = '<div class="loading-indicator">⚠️ 暂无城市数据，请检查CSV文件路径</div>';
                detailContainer.innerHTML = `<div style="padding:1rem;text-align:center">❌ 未找到城市数据</div>`;
                return;
            }
            // 渲染城市按钮列表
            let html = '';
            cities.forEach(city => {
                const escapedCity = escapeHtml(city);
                html += `
                    <div class="city-btn" data-city="${escapeAttr(city)}">
                        <span class="city-emoji">📍</span>
                        <span class="city-name">${escapedCity}</span>
                    </div>
                `;
            });
            cityListContainer.innerHTML = html;

            // 获取所有按钮并存储
            cityButtons = Array.from(document.querySelectorAll('.city-btn'));

            // 绑定鼠标点击事件
            cityButtons.forEach((btn, idx) => {
                btn.addEventListener('click', (e) => {
                    const cityName = btn.getAttribute('data-city');
                    if (cityName) {
                        setActiveByIndex(idx);
                        fetchCityDetail(cityName);
                    }
                });
            });

            // 默认选中第一个
            if (cityButtons.length > 0) {
                setActiveByIndex(0);
                const firstCity = cityButtons[0].getAttribute('data-city');
                fetchCityDetail(firstCity);
            }

            // 聚焦左侧卡片，以便键盘事件生效
            cityListCard.focus();
        } catch (err) {
            console.error(err);
            cityListContainer.innerHTML = '<div class="loading-indicator">❌ 加载失败，请检查后端服务</div>';
            detailContainer.innerHTML = `<div style="padding:1rem;color:#ffbaba">无法连接后端API</div>`;
        }
    }

    // 设置当前活跃按钮（高亮且记录索引）
    function setActiveByIndex(newIndex) {
        if (newIndex < 0 || newIndex >= cityButtons.length) return;
        // 移除所有 active 类
        cityButtons.forEach(btn => btn.classList.remove('active'));
        cityButtons[newIndex].classList.add('active');
        currentIndex = newIndex;
        currentActiveCity = cityButtons[newIndex].getAttribute('data-city');
        // 滚动到可视区域
        cityButtons[newIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 向上/向下移动
    function moveSelection(delta) {
        if (cityButtons.length === 0) return;
        let newIndex = currentIndex + delta;
        if (newIndex < 0) newIndex = 0;
        if (newIndex >= cityButtons.length) newIndex = cityButtons.length - 1;
        if (newIndex !== currentIndex) {
            setActiveByIndex(newIndex);
            const cityName = cityButtons[newIndex].getAttribute('data-city');
            fetchCityDetail(cityName);
        }
    }

    // 获取城市详情并渲染右侧卡片
    async function fetchCityDetail(cityName) {
        if (!cityName) return;
        detailContainer.innerHTML = `<div style="text-align:center; padding:1rem"><span class="badge-status">⏳ 加载 ${escapeHtml(cityName)} 信息...</span></div>`;
        try {
            const encodedCity = encodeURIComponent(cityName);
            const response = await fetch(`/api/city/${encodedCity}`);
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || '获取详情失败');
            }
            const city = await response.json();
            renderCityDetail(city);
        } catch (err) {
            console.error(err);
            detailContainer.innerHTML = `<div style="padding:1rem;color:#ffc0c0;text-align:center">❌ 加载失败：${escapeHtml(err.message)}</div>`;
        }
    }

    // 渲染城市详细卡片
    function renderCityDetail(city) {
        const topTrait = city.top_trait || '未知';
        const budgetLevel = city.budget_level || '—';
        const idealDurations = city.ideal_durations || '未提供';
        const region = city.region || '—';
        const country = city.country || '—';
        const shortDesc = city.short_description || '暂无详细描述，但这座城市的独特魅力等待您亲自发现。';
        const interestTags = [];
        if (parseInt(city.culture) >= 4) interestTags.push('🏛️ 文化丰厚');
        if (parseInt(city.adventure) >= 4) interestTags.push('🧗 冒险');
        if (parseInt(city.nature) >= 4) interestTags.push('🌿 自然');
        if (parseInt(city.beaches) >= 4) interestTags.push('🏖️ 海滩');
        if (parseInt(city.nightlife) >= 4) interestTags.push('🎉 夜生活');
        if (parseInt(city.cuisine) >= 4) interestTags.push('🍜 美食');
        if (parseInt(city.wellness) >= 4) interestTags.push('🧘 康养');
        if (parseInt(city.urban) >= 4) interestTags.push('🏙️ 都市');
        if (parseInt(city.seclusion) >= 4) interestTags.push('🌲 隐世');

        const html = `
            <div class="city-detail">
                <div class="detail-main">
                    <div class="city-name-large">${escapeHtml(city.city)} · ${escapeHtml(country)}</div>
                    <div style="margin-bottom: 0.4rem;">
                        <span class="tag">📍 ${escapeHtml(region)}</span>
                        <span class="tag">💰 ${escapeHtml(budgetLevel)}</span>
                        <span class="tag">⭐ 亮点: ${escapeHtml(topTrait)}</span>
                    </div>
                    <p>📖 <strong>简介</strong> ${escapeHtml(shortDesc)}</p>
                    <p>⏱️ <strong>推荐时长</strong> ${escapeHtml(idealDurations)}</p>
                    <div>
                        <strong>✨ 特色标签</strong><br>
                        ${interestTags.length ? interestTags.map(t => `<span class="tag" style="background:#1f3b4ccc;">${t}</span>`).join(' ') : '<span class="tag">多元魅力</span>'}
                    </div>
                    ${city.budget_score ? `<p>📊 预算友好度: ${'⭐'.repeat(Number(city.budget_score) || 0)} (${city.budget_score}/5)</p>` : ''}
                </div>
                <div class="detail-badge">
                    <span class="badge-status" style="background:#2c5f2dcc;">✅ 数据已同步</span>
                </div>
            </div>
        `;
        detailContainer.innerHTML = html;
    }

    // 辅助函数
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    function escapeAttr(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 键盘事件监听 (上下键)
    function handleKeydown(e) {
        // 确保焦点在左侧卡片上或者没有输入框激活，避免全局干扰；我们直接让左侧卡片聚焦时生效，更符合预期
        if (document.activeElement === cityListCard || document.activeElement === document.body) {
            if (e.key === 'ArrowUp' || e.key === 'Up') {
                e.preventDefault();
                moveSelection(-1);
            } else if (e.key === 'ArrowDown' || e.key === 'Down') {
                e.preventDefault();
                moveSelection(1);
            }
        }
    }

    // 背景图片检测
    const bgImg = new Image();
    bgImg.onload = () => {
        bgStatusSpan.innerHTML = '✅ 全屏背景加载成功';
        bgStatusSpan.style.color = "#b8f2b8";
    };
    bgImg.onerror = () => {
        bgStatusSpan.innerHTML = '❌ 背景图片加载失败，请检查服务端图片路径';
        bgStatusSpan.style.color = "#ffc0c0";
        console.error("背景图片无法加载");
    };
    bgImg.src = '/preview.jpg';

    // 初始化
    loadCityList();
    window.addEventListener('keydown', handleKeydown);
    // 确保左侧卡片可以聚焦（已设置tabindex）
    // 点击页面其他区域时，若再次按下上下键，可点击左侧卡片重新获取焦点
</script>
</body>
</html>
